<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>句動詞イメージ帳</title>
<meta name="description" content="動詞のイメージと前置詞・副詞のイメージを足して、句動詞を「なぜその意味になるか」から覚える。">
<meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E131A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="句動詞">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.PV_STANDALONE = true;</script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* layout: quiet field-guide UI on cool paper; drawings play on a graph-paper "stage"; bottom tab bar; color only carries meaning (pink = verb, teal = particle, yellow = the moving thing) */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#EDF0F4; --ink:#17202E; --ink-2:#536073; --ink-3:#8590A2; --line:#E2E6EC;
  --stage:#F3F6FA; --grid:#E2E8F0;
  --verb:#C2255C; --verb-soft:#FBEAF0; --part:#0B7A75; --part-soft:#DFF1EF; --hl:#FFD43B; --hl-soft:#FFEFA8; --tokInk:#17202E;
  --verbBg:var(--verb-soft); --partBg:var(--part-soft);
  --f-ja:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --f-en:"Literata","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --bar:52px; --tab:62px;
  --shadow:0 1px 2px rgba(23,32,46,.05),0 4px 16px rgba(23,32,46,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131A; --surface:#161C25; --surface-2:#1F2733; --ink:#E9EEF5; --ink-2:#A6B1C1; --ink-3:#6E798B; --line:#263040;
    --stage:#121923; --grid:#1D2633;
    --verb:#FF7DA8; --verb-soft:#3A1D2A; --part:#4ECDC2; --part-soft:#112F2D; --hl:#FFD43B; --hl-soft:#5A4A10; --tokInk:#17202E;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161C25; --surface-2:#1F2733; --ink:#E9EEF5; --ink-2:#A6B1C1; --ink-3:#6E798B; --line:#263040;
  --stage:#121923; --grid:#1D2633;
  --verb:#FF7DA8; --verb-soft:#3A1D2A; --part:#4ECDC2; --part-soft:#112F2D; --hl:#FFD43B; --hl-soft:#5A4A10; --tokInk:#17202E;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 var(--f-ja);
  padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) + 28px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.en{font-family:var(--f-en)}
.v{color:var(--verb)} .p{color:var(--part)} .x{color:var(--ink-3)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--part);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
svg{flex:none}

/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.appbar-in{height:var(--bar);display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:16px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.tools{display:flex;gap:2px}
.tool{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:0;border-radius:999px;background:none;color:var(--ink-2);font-size:12.5px;font-weight:500;white-space:nowrap}
.tool:active{background:var(--surface-2)}
.tool svg{width:18px;height:18px}

/* bottom tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);background:color-mix(in srgb,var(--surface) 90%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);
  padding:0 max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px))}
.tabbar-in{max-width:720px;margin:0 auto;height:var(--tab);display:grid;grid-template-columns:repeat(4,1fr)}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--ink-3);font-size:11px;font-weight:700;letter-spacing:.02em}
.tb .ic{display:grid;place-items:center;width:56px;height:30px;border-radius:15px;transition:background .2s}
.tb svg{width:22px;height:22px}
.tb[aria-selected="true"]{color:var(--ink)}
.tb[aria-selected="true"] .ic{background:var(--surface-2)}

main{padding-top:16px}

/* stage (graph paper only where drawings play) */
.stage{background-color:var(--stage);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:16px 16px;background-position:-1px -1px;border-radius:14px}

/* featured */
.feature{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:10px;box-shadow:var(--shadow);margin-bottom:22px}
.eqrow{display:grid;grid-template-columns:1fr 14px 1fr 14px 1.7fr;align-items:center;gap:2px;padding:10px 8px;cursor:pointer}
.eqrow figure{margin:0;min-width:0}
.eqrow svg{display:block;width:100%;height:auto}
.op{font:500 18px/1 var(--f-en);color:var(--ink-3);text-align:center}
.fbody{padding:14px 8px 6px}
.fcap{font-size:12.5px;color:var(--ink-3);line-height:1.6}
.fcap .en{font-size:13.5px;font-weight:600}
.hw{font:600 30px/1.15 var(--f-en);letter-spacing:-.01em;margin-top:6px}
.mean{font-size:15px;color:var(--ink-2);margin-top:4px}
.why1{font-size:14.5px;line-height:1.7;margin-top:12px;padding-left:12px;border-left:3px solid var(--hl)}
.factions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 18px;border-radius:999px;border:0;background:var(--surface-2);color:var(--ink);font-size:14px;font-weight:700;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.ghost{background:none;color:var(--part);padding:0 6px}
.btn.danger{background:none;color:var(--verb);height:34px;padding:0 10px;font-size:13px}
.btn:active{transform:scale(.97)}
.tf,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;line-height:1.6}
textarea{resize:vertical;min-height:84px}
.tf:focus,textarea:focus{outline:none;border-color:var(--part)}
select.tf{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.saved{font-size:13px;color:var(--part)}

/* search + filters */
.search{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.search svg{width:18px;height:18px;color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:none}
.search:focus-within{border-color:var(--part)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 2px}
.filter{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px 0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink-2)}
.filter b{font:600 15px var(--f-en);color:var(--ink)}
.filter svg{width:14px;height:14px;color:var(--ink-3)}
.filter.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.filter.on b,.filter.on svg{color:var(--bg)}
.clear{border:0;background:none;color:var(--part);font-size:13px;font-weight:700;padding:6px}
.meta{font-size:12.5px;color:var(--ink-3);margin:10px 2px 0;font-variant-numeric:tabular-nums}

/* rows */
.grp{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bar));z-index:2;background:var(--bg);display:flex;align-items:baseline;gap:8px;padding:18px 4px 8px;font-size:13px;color:var(--ink-2)}
.grp .en{font:600 19px var(--f-en);color:var(--part)}
.grp .n{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{position:relative;display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:10px 14px 10px 10px;content-visibility:auto;contain-intrinsic-size:auto 78px}
.rows > .row + .row::before,.rows > .myrow + .myrow::before,.rows > .note-item + .note-item::before{content:"";position:absolute;left:100px;right:0;top:0;height:1px;background:var(--line)}
.rows > .note-item + .note-item::before{left:16px}
.row:active{background:var(--surface-2)}
.mini{display:block}
.mini > svg{display:block;width:76px;height:57px;border-radius:10px;background:var(--stage)}
.hws{display:block;font:600 19px/1.25 var(--f-en)}
.rk{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;padding:0 6px;border-radius:4px;background:var(--hl-soft);color:var(--ink)}
.rm{display:block;font-size:13.5px;color:var(--ink-2);line-height:1.55;margin-top:2px}
.rw{display:block;font-size:13px;color:var(--ink-3);line-height:1.6;margin-top:4px}
.st{display:flex;gap:6px;align-items:center;min-width:18px;justify-content:flex-end}
.dot-memo{display:block;width:7px;height:7px;border-radius:50%;background:var(--verb)}
.chk{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--part);color:#fff}
.chk svg{width:13px;height:13px}
.badge{display:inline-block;font:700 10.5px/1.6 var(--f-ja);color:var(--verb);background:var(--verb-soft);border-radius:999px;padding:0 7px;margin-left:8px;vertical-align:3px}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}
.empty .btn{margin-top:12px}

/* detail page */
.sheet{position:fixed;inset:0;z-index:20;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 56px)}
.sheet.open{animation:rise .26s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.dbar{position:sticky;top:0;z-index:3;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.dbar-in{height:var(--bar);display:flex;justify-content:space-between;align-items:center}
.back{display:inline-flex;align-items:center;gap:0;height:38px;padding:0 12px 0 2px;margin-left:-8px;border:0;background:none;font-size:15px;font-weight:500}
.back svg{width:24px;height:24px}
.learn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px 0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;color:var(--ink-2)}
.learn .cb{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink-3)}
.learn .cb svg{width:12px;height:12px;opacity:0}
.learn[aria-pressed="true"]{background:var(--part);border-color:var(--part);color:#fff}
.learn[aria-pressed="true"] .cb{border-color:#fff;background:#fff;color:var(--part)}
.learn[aria-pressed="true"] .cb svg{opacity:1}
.dhead{padding:6px 0 18px}
.dhead .hw{font-size:38px;cursor:pointer;margin:0}
.dhead .hw .spk{display:inline-block;width:20px;height:20px;margin-left:10px;color:var(--ink-3);vertical-align:2px}
.dhead .hw .spk svg{width:100%;height:100%}
.dmean{font-size:17px;color:var(--ink-2);margin-top:8px;line-height:1.6}
.eq{display:grid;grid-template-columns:1fr 20px 1fr;gap:2px 4px;align-items:center;padding:12px}
.cell{margin:0;text-align:center;min-width:0}
.cell > svg{display:block;width:100%;height:auto}
.cell.vv > svg{max-width:100px;margin:0 auto}
.cell.pp > svg{max-width:136px;margin:0 auto}
.cell figcaption{font-size:12px;color:var(--ink-2);line-height:1.5;margin-top:2px}
.cell figcaption b{display:block;font:600 17px/1.3 var(--f-en)}
.cell.vv b{color:var(--verb)} .cell.pp b{color:var(--part)}
.eqop{grid-column:1/-1;padding:2px 0}
.cell.res{grid-column:1/-1;background:var(--surface);border-radius:12px;padding:8px;box-shadow:var(--shadow)}
.cell.res > svg{max-width:300px;margin:0 auto}
@media (min-width:640px){
  .eq{grid-template-columns:1fr 20px 1fr 20px 1.7fr}
  .eqop,.cell.res{grid-column:auto}
}
.sec{padding:22px 0;border-top:1px solid var(--line)}
.eq + .sec{border-top:0;padding-top:26px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink-3);letter-spacing:.08em;margin-bottom:10px}
.sh small{font-size:12px;font-weight:500;letter-spacing:0}
.lead2{font-size:16px;font-weight:500}

/* explanation path */
.branch + .branch{margin-top:24px}
.bm{font-size:17px;font-weight:700;margin-bottom:10px;line-height:1.5}
.steps{list-style:none;margin:0;padding:0}
.steps li{position:relative;padding:0 0 14px 24px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;left:3px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--bg)}
.steps li:not(:last-child)::after{content:"";position:absolute;left:7.5px;top:18px;bottom:0;width:1px;background:var(--line)}
.s1{--c:var(--part)} .s2{--c:var(--hl)} .s3{--c:var(--verb)}
.sl{display:block;font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.1em;line-height:1.4}
.steps p{margin-top:1px;font-size:15.5px;line-height:1.75}
.s2 p{font-weight:700}
.s2 p span{background:linear-gradient(transparent 62%,var(--hl-soft) 62%)}
.compact .bm{font-size:15.5px}
.compact .steps p{font-size:14.5px}

/* examples */
.exl{list-style:none;margin:0;padding:0}
.exl li{position:relative;padding:12px 44px 12px 12px;margin:0 -12px;border-radius:14px;cursor:pointer;transition:background .15s;-webkit-tap-highlight-color:transparent}
.exl li + li{margin-top:2px}
.exl li:active,.exl li.playing{background:var(--part-soft)}
.exl .e{display:block;font:500 18.5px/1.5 var(--f-en)}
.exl .e b{color:var(--part);font-weight:600}
.exl .j{display:block;font-size:14px;color:var(--ink-2);margin-top:3px}
.exl .ico{position:absolute;right:12px;top:16px;width:20px;height:20px;color:var(--ink-3)}
.exl .ico svg{width:100%;height:100%}
.exl li.playing .ico{color:var(--part)}

/* info + relatives */
.dl{display:grid;gap:18px;margin:0}
.dl dt{font-size:12.5px;font-weight:700;color:var(--ink-3);letter-spacing:.06em}
.dl dt .en{letter-spacing:0;font-size:14px;color:var(--verb)}
.dl dd{margin:4px 0 0;font-size:15.5px;line-height:1.8}
.sib + .sib{margin-top:20px}
.sibl{font-size:13px;color:var(--ink-2);margin-bottom:8px}
.sibl .en{font-size:15px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;background:var(--surface-2);border-radius:999px;padding:6px 13px;font:600 15px/1.3 var(--f-en)}
.chip.vc{color:var(--verb)} .chip.pc{color:var(--part)}
.chip.jc{font:500 13.5px/1.4 var(--f-ja);color:var(--ink)}
.more-link{display:inline-flex;align-items:center;gap:2px;margin-top:10px;border:0;background:none;color:var(--part);font-size:14px;font-weight:700;padding:4px 0}
.more-link svg{width:16px;height:16px}
.mrow{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.askrow{display:flex;gap:8px}
.askrow .tf{flex:1;min-width:0}
.ans{margin-top:12px;white-space:pre-wrap;font-size:15px;line-height:1.8}
.ans:empty{display:none}

/* compare */
.seg4{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;margin-bottom:12px}
.seg4 button{border:0;background:none;border-radius:9px;height:36px;font-size:13px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.seg4 button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(23,32,46,.12)}
.pager{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:4px}
.pg{width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--ink-2);display:grid;place-items:center}
.pg:active{background:var(--surface-2)}
.pg svg{width:22px;height:22px}
.pgtitle{border:0;background:none;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;height:48px;font-size:17px;font-weight:700;border-radius:12px}
.pgtitle:active{background:var(--surface-2)}
.pgtitle > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgtitle .en{font:600 26px var(--f-en)}
.pgtitle svg{width:16px;height:16px;color:var(--ink-3)}
.pgpos{grid-column:1/-1;text-align:center;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin:-4px 0 14px}
.intro{font-size:15px;color:var(--ink-2);line-height:1.8;margin-bottom:6px}
.core{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center;margin-bottom:18px}
.core .stage{padding:6px}
.core .stage svg{display:block;width:100%;height:auto}
.core b{display:block;font-size:16px;line-height:1.55}
.core p{font-size:14px;color:var(--ink-2);margin-top:4px;line-height:1.7}
.ext{list-style:none;margin:0 0 6px;padding:0}
.ext li{padding:12px 0;border-top:1px solid var(--line)}
.ext li:first-child{border-top:0;padding-top:0}
.ext b{display:block;font-size:15px}
.ext span{display:block;font-size:14.5px;color:var(--ink-2);line-height:1.7;margin-top:2px}
.ext .en{font-size:14px;color:var(--part);margin-top:4px}
.ext .so{font-size:13.5px;color:var(--ink-3);margin-top:2px}
.note{font-size:14.5px;line-height:1.8;color:var(--ink-2);margin:12px 0 0}
details.md{margin:16px 0 0;border-top:1px solid var(--line);padding-top:12px}
details.md > summary,details.more > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--ink-2)}
details > summary::-webkit-details-marker{display:none}
details.md > summary svg,details.more > summary svg{width:16px;height:16px;transition:transform .2s}
details[open] > summary svg{transform:rotate(180deg)}
details.md .memo{margin-top:10px}
.tblhead{font-size:12.5px;font-weight:700;color:var(--ink-3);letter-spacing:.08em;margin:24px 4px 8px}

/* quiz */

.opt.ok{background:var(--part);border-color:var(--part);color:#fff}

.qf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}
.qf span{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* parts */
.ph2{font-size:21px;font-weight:700;margin:4px 0 4px}
.pnote{font-size:14px;color:var(--ink-2);line-height:1.8;margin-bottom:14px}
.vgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:32px}

.pcard > svg{display:block;width:100%;height:auto;border-radius:12px;background:var(--stage)}
.pcard b{display:block;font:600 19px/1.2 var(--f-en);color:var(--part);margin:10px 4px 0}
.pcard span{display:block;font-size:12.5px;color:var(--ink-2);margin:2px 4px 0;line-height:1.55}

/* me */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
details.addd > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:700}

#addform{display:grid;gap:14px;margin-top:16px}
.f3{display:grid;grid-template-columns:1.15fr 1.25fr 1fr;gap:8px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{min-width:0}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.fgl{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.1em;margin:6px 0 -4px;padding-top:12px;border-top:1px solid var(--line)}
details.more{border-top:1px solid var(--line);padding-top:12px}
details.more[open] > summary{margin-bottom:12px}
details.more .inner{display:grid;gap:14px}
.grp2{display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:700;margin:28px 4px 10px}
.grp2 .n{font-size:12.5px;color:var(--ink-3);font-weight:500}
.emptyline{font-size:14px;color:var(--ink-3);padding:4px}
.myrow{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}

.note-item span{display:block;font-size:14px;color:var(--ink-2);white-space:pre-wrap;line-height:1.7;margin-top:2px}

/* picker sheet */
.picker{position:fixed;inset:0;z-index:30}
.pk-back{position:absolute;inset:0;background:rgba(8,12,18,.38);animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.pk-panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:720px;max-height:80vh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.pk-grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}

.pk-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pk-grid.one{grid-template-columns:1fr}
.pk{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:9px 10px;text-align:left;min-height:56px;min-width:0}
.pk b{display:block;font:600 16.5px/1.25 var(--f-en)}

.pk.kv b{color:var(--verb)} .pk.kp b{color:var(--part)}

/* verb → particle phase labels (same 4.2s clock as the composite) */
.phase{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.phase span{display:inline-flex;align-items:baseline;gap:6px;padding:4px 12px;border-radius:999px;font-size:13px;color:var(--ink-2);background:var(--surface-2);opacity:.45}
.phase b{font:600 15px var(--f-en)}
.ph1 b{color:var(--verb)} .ph2 b{color:var(--part)}
.ph1{animation:ph1 4.2s linear infinite} .ph2{animation:ph2 4.2s linear infinite}
@keyframes ph1{0%,36%{opacity:1;background:var(--verb-soft);color:var(--ink)}40%,100%{opacity:.45;background:var(--surface-2);color:var(--ink-2)}}
@keyframes ph2{0%,37%{opacity:.45;background:var(--surface-2);color:var(--ink-2)}41%,92%{opacity:1;background:var(--part-soft);color:var(--ink)}97%,100%{opacity:.45;background:var(--surface-2);color:var(--ink-2)}}

.lines li{padding-right:12px}

.dline{border:0;background:none;color:var(--verb);font-size:12.5px;font-weight:700;padding:2px 0}
.lineform{display:grid;gap:12px;margin-top:12px}
.note-item span.en{font-size:15px;color:var(--ink);font-family:var(--f-en)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) + 14px);z-index:40;background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:13.5px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.18)}

<script>
const D = window.PV_DATA || {particles:{},verbs:{},entries:[],sets:[]};
const P = D.particles, V = D.verbs;
const W = window.PV_WHY || {entries:{}, verbs:{}, particles:{}};
const PORDER = Object.keys(P), VORDER = Object.keys(V);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mkId = (v,p,x) => [v,p,x].filter(Boolean).join("-").replace(/\s+/g,"-").toLowerCase();
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

function fromRow(r){
  const [v,p,x,mean,tok,key,ps,tail,nuance,scene,e1,j1,e2,j2] = r;
  return {id:mkId(v,p,x),v,p,x,mean,tok,key,ps,tail,nuance,scene,ex:[[e1,j1],[e2,j2]].filter(e=>e[0])};
}
const BUILT = D.entries.map(fromRow);
BUILT.forEach(e => { const xs = (D.extraEx||{})[e.id]; if(xs) e.ex = e.ex.concat(xs.filter(x=>!e.ex.some(y=>y[0]===x[0]))); });
let ALL = BUILT.slice(), byId = {};

const STANDALONE = !!window.PV_STANDALONE;  /* スマホにインストールする単体版 */
/* ===== 保存(じぶんのメモ・追加・覚えた) ===== */
const store = {notes:{}, learned:new Set(), mine:[], lines:[], mode:"local"};
let db = null;
const LS = "pvimg-v2";
function loadLocal(){
  try{
    const o = JSON.parse(localStorage.getItem(LS) || "null");
    if(o){ store.notes = o.notes||{}; store.learned = new Set(o.learned||[]); store.mine = o.mine||[]; store.lines = o.lines||[]; }
    else { const old = JSON.parse(localStorage.getItem("pvimg-learned")||"[]"); store.learned = new Set(old); }
  }catch(e){}
}
function saveLocal(){
  if(store.mode!=="local") return;
  try{ localStorage.setItem(LS, JSON.stringify({notes:store.notes, learned:[...store.learned], mine:store.mine, lines:store.lines})); }catch(e){}
}
function rebuild(){
  const mine = store.mine.map(m => ({
    id:"my-"+m._id, v:m.v||"", p:m.p||"", x:m.x||"", mean:m.mean||"", tok:m.tok||"", key:m.key||"", ps:m.ps||"",
    tail:m.tail||"", nuance:m.nuance||"", scene:m.scene||"", mine:true, _id:m._id,
    ex:(m.ex||[]).filter(e=>e && e.en).map(e=>[e.en, e.ja||""]),
    why:(m.why||[]).filter(b=>b && (b.pic||b.bridge||b.so)).map(b=>[b.m||m.mean||"", b.pic||"", b.bridge||"", b.so||""])
  }));
  ALL = BUILT.concat(mine);
  byId = Object.fromEntries(ALL.map(e=>[e.id,e]));
}
async function initStore(){
  loadLocal(); rebuild();
  if(!(window.claude && window.claude.use)) return;
  try{ db = await window.claude.use("db"); }catch(e){ db = null; }
  if(!db) return;
  store.mode = "db";
  const localLearned = [...store.learned];
  store.notes = {}; store.learned = new Set(); store.mine = []; store.lines = [];
  let first = true;
  db.collection("notes").onSnapshot(s => {
    store.notes = {}; s.docs.forEach(d => { const t = (d.data()||{}).text; if(t) store.notes[d.id] = t; });
    onStoreChange();
  }, () => {});
  db.doc("state/learned").onSnapshot(d => {
    if(first && !d.exists && localLearned.length){ first = false; db.doc("state/learned").set({ids:localLearned}).catch(()=>{}); }
    first = false;
    store.learned = new Set(d.exists ? ((d.data()||{}).ids||[]) : []);
    onStoreChange();
  }, () => {});
  db.collection("mine").onSnapshot(s => {
    store.mine = s.docs.map(d => ({...d.data(), _id:d.id})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    rebuild(); onStoreChange(true);
  }, () => {});
  db.collection("lines").onSnapshot(s => {
    store.lines = s.docs.map(d => ({...d.data(), _id:d.id})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    onStoreChange();
  }, () => {});
  onStoreChange(true);
}
async function saveNote(key, text){
  text = text.trim();
  if(store.mode==="db"){
    if(text) await db.collection("notes").doc(key).set({text, updatedAt:Date.now()});
    else await db.collection("notes").doc(key).delete();
  }else{
    if(text) store.notes[key] = text; else delete store.notes[key];
    saveLocal(); onStoreChange();
  }
}
async function toggleLearned(id){
  const s = new Set(store.learned);
  s.has(id) ? s.delete(id) : s.add(id);
  if(store.mode==="db"){ store.learned = s; onStoreChange(); await db.doc("state/learned").set({ids:[...s]}); }
  else { store.learned = s; saveLocal(); onStoreChange(); }
}
async function addMine(obj){
  if(store.mode==="db"){ await db.collection("mine").add(obj); }
  else { store.mine.unshift({...obj, _id:"l"+Date.now()}); saveLocal(); rebuild(); onStoreChange(true); }
}
async function addLine(obj){
  if(store.mode==="db"){ await db.collection("lines").add(obj); }
  else { store.lines.unshift({...obj, _id:"s"+Date.now()}); saveLocal(); onStoreChange(); }
}
async function delLine(_id){
  if(store.mode==="db"){ await db.collection("lines").doc(_id).delete(); }
  else { store.lines = store.lines.filter(m=>m._id!==_id); saveLocal(); onStoreChange(); }
}
async function delMine(_id){
  if(store.mode==="db"){ await db.collection("mine").doc(_id).delete(); }
  else { store.mine = store.mine.filter(m=>m._id!==_id); saveLocal(); rebuild(); onStoreChange(true); }
}
function onStoreChange(structural){
  if(structural){ renderFilters(); renderList(); renderParts(); if(currentView==="cmp") renderCmp(); }
  else updateListMarks();
  if(currentView==="me") renderMe();
  document.querySelectorAll("textarea[data-key]").forEach(t => {
    if(document.activeElement !== t && !t.dataset.dirty) t.value = store.notes[t.dataset.key] || "";
  });
  const lb = document.getElementById("sh-learn");
  if(lb) lb.setAttribute("aria-pressed", store.learned.has(lb.dataset.id));
  const box = document.getElementById("lines-box");
  if(box) box.innerHTML = linesHTML(box.dataset.id);
}

/* ===== 絵: 動詞 ===== */
const person = (x,y,arm) => `<circle cx="${x}" cy="${y}" r="9"/><path d="M${x} ${y+9}v26M${x} ${y+35}l-9 16M${x} ${y+35}l9 16M${x} ${y+18}l${arm||14} 6"/>`;
const home = `<path d="M6 106V92l12-10 12 10v14z" opacity=".55"/>`;
const VART = {

function clipURL(v, text){

  if(location.hash.slice(1) === h) applyHash(); else location.hash = h;
}
function applyHash(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(h.startsWith("d-") && byId[h.slice(2)]){
    if(h === expectHash) expectHash = null; else detailDepth = Math.max(1, detailDepth - 1);
    renderDetail(h.slice(2)); return;

  const v = ["list","cmp","parts","me"].includes(h) ? h : "list";

}

/* Claude に聞く */
let sampleNS;
async function getSample(){
  if(sampleNS !== undefined) return sampleNS;
  try{ sampleNS = (window.claude && window.claude.use) ? await window.claude.use("sample") : null; }catch(e){ sampleNS = null; }
  return sampleNS;
}
async function askClaude(){
  const q = document.getElementById("askq").value.trim();
  const out = document.getElementById("ans");
  const e = byId[document.getElementById("sh-learn").dataset.id];
  if(!q){ out.textContent = "質問を入力してから押してください。"; return; }
  const s = await getSample();
  if(!s){ out.textContent = "この表示では Claude に聞けない。claude.ai でこのページを開くと使える。"; return; }
  out.textContent = "考え中…";
  const ctx = `句動詞「${label(e)}」(意味:${e.mean})。動詞 ${e.v} のコアイメージ:${vja(e.v)}。小さな言葉 ${e.p} のイメージ:${pja(e)}。成り立ち:${whyOf(e).map(b=>b.join(" → ")).join(" / ")}。`;
  try{
    await s(`あなたは英語の句動詞を「動詞のコアイメージ＋前置詞・副詞のイメージ」で教える先生。学習者は意味の列挙ではなく「なぜその意味になるのか」という成り立ちを知りたい。日本語で、スマホで読みやすく200字以内、「物理的な絵 → 何を何に見立てるか → だからこの意味」の順に答えて。必要なら短い英語例文を1つ。\n${ctx}\n学習者の質問:${q}`,
      {modelTier:"default", onText:({text})=>{ out.textContent = text; }});
  }catch(err){
    out.textContent = err && err.code==="rate_limited" ? "少し時間をおいてからもう一度。" : "今は答えられなかった。もう一度試してください。";
  }
}

let cmpMode = "set", cmpKey = "0", currentView = "list";
const MODES = [["set","似ている組"],["verb","動詞"],["part","小さな言葉"],["mix","クイズ"]];
function goCmp(mode, key, replace){ cmpMode = mode; cmpKey = String(key); renderCmp(); detailDepth = 0; nav("cmp", replace); window.scrollTo(0,0); }
function cmpKeys(){
  if(cmpMode==="set") return D.sets.map((s,i)=>[String(i), s.title, `${s.ids.length}語`]);
  if(cmpMode==="verb") return usedVerbs().map(v=>[v, v, vja(v)||"自分で追加"]);
  if(cmpMode==="part") return usedParts().map(p=>[p, p, P[p].ja]);
  return [];
}
function renderCmp(){
  document.getElementById("cmodes").innerHTML = MODES.map(([k,l])=>`<button role="tab" data-mode="${k}" aria-selected="${cmpMode===k}">${l}</button>`).join("");
  const keys = cmpKeys();
  document.getElementById("pager").hidden = cmpMode==="mix";
  if(keys.length && !keys.some(k=>k[0]===cmpKey)) cmpKey = keys[0][0];
  const idx = keys.findIndex(k=>k[0]===cmpKey);
  if(cmpMode!=="mix" && idx>=0){
    document.getElementById("pgtitle").innerHTML = cmpMode==="set"
      ? `<span>${esc(keys[idx][1])}</span>${ICON.chev}`
      : `<span class="en ${cmpMode==="verb"?"v":"p"}">${esc(cmpKey)}</span>${ICON.chev}`;
    document.getElementById("pgpos").textContent = `${idx+1} / ${keys.length}`;
  }
  const body = document.getElementById("cbody");
  let pool = [], html = "";
  if(cmpMode==="set"){
    const s = D.sets[+cmpKey];
    pool = s.ids.map(id=>byId[id]).filter(Boolean);
    html = `<p class="intro">${esc(s.note)}</p><p class="tblhead">${esc(s.axis)}</p><div class="rows">${pool.map(e=>rowHTML(e,{key:1,why:1})).join("")}</div>`;
  }else if(cmpMode==="verb"){
    pool = ALL.filter(e=>e.v===cmpKey);
    const vv = V[cmpKey];
    html = `<div class="core"><div class="stage">${verbSVG(cmpKey)}</div><div><b>${esc(vv?vv.ja:"自分で追加した動詞")}</b>${vv?`<p>${esc(vv.desc)}</p>`:""}</div></div>
      ${W.verbs[cmpKey] ? `<ul class="ext">${W.verbs[cmpKey].map(([m,pic,bridge,so])=>`<li><b>${esc(m)}</b><span>${esc(bridge)}</span><span class="so">${esc(so)}</span></li>`).join("")}</ul>` : ""}
      <details class="md"><summary>自分のメモ${store.notes["v-"+cmpKey]?"(あり)":""}${ICON.chev}</summary>${memoHTML("v-"+cmpKey, `${cmpKey} を自分ならどんな絵で覚える？`, true)}</details>
      <p class="tblhead">${esc(cmpKey)} ＋ どこへ動く？</p><div class="rows">${pool.map(e=>rowHTML(e,{key:1,why:1})).join("")}</div>`;
  }else if(cmpMode==="part"){
    pool = ALL.filter(e=>inPart(e,cmpKey));
    const pp = P[cmpKey];
    html = `<div class="core"><div class="stage">${sceneSVG(cmpKey,"")}</div><div><b>${esc(pp.ja)}</b><p>${esc(pp.core)}</p></div></div>
      ${W.particles[cmpKey] ? `<ul class="ext">${W.particles[cmpKey].map(([m,why,ex])=>`<li><b>${esc(m)}</b><span>${esc(why)}</span><span class="en">${esc(ex)}</span></li>`).join("")}</ul>` : `<p class="note">${pp.ext.map(esc).join("<br>")}</p>`}
      ${pp.note ? `<p class="note">${esc(pp.note)}</p>` : ""}
      <details class="md"><summary>自分のメモ${store.notes["p-"+cmpKey]?"(あり)":""}${ICON.chev}</summary>${memoHTML("p-"+cmpKey, `${cmpKey} のイメージ、自分の言葉で`, true)}</details>
      <p class="tblhead">どの動詞と組む？</p><div class="rows">${pool.map(e=>rowHTML(e,{key:1,why:1})).join("")}</div>`;
  }else{
    pool = ALL;
    html = `<p class="intro">全部の句動詞からランダムに出題。選択肢には「同じ動詞で小さな言葉ちがい」と「同じ小さな言葉で動詞ちがい」がまざる。</p>`;
  }
  body.innerHTML = html + `<div class="quiz" id="quiz"></div>`;
  quizPool = pool; quizMixed = cmpMode==="mix"; quizScore = {ok:0,n:0};
  askQuiz();
}
function stepCmp(dir){
  const keys = cmpKeys(); if(!keys.length) return;
  const i = keys.findIndex(k=>k[0]===cmpKey);
  cmpKey = keys[(i + dir + keys.length) % keys.length][0];
  renderCmp(); window.scrollTo(0,0);
}
document.getElementById("cmodes").addEventListener("click", e=>{
  const b = e.target.closest("[data-mode]"); if(!b || b.dataset.mode===cmpMode) return;
  cmpMode = b.dataset.mode; cmpKey = cmpMode==="set" ? "0" : cmpMode==="verb" ? "take" : cmpMode==="part" ? "out" : "";
  renderCmp();
});
document.getElementById("pager").addEventListener("click", e=>{
  const s = e.target.closest("[data-step]"); if(s) return stepCmp(+s.dataset.step);
  if(e.target.closest("#pgtitle")){
    const keys = cmpKeys();
    const title = cmpMode==="set" ? "似ている組をえらぶ" : cmpMode==="verb" ? "動詞をえらぶ" : "小さな言葉をえらぶ";
    openPicker(title, keys, cmpKey, cmpMode==="set" ? "kj" : cmpMode==="verb" ? "kv" : "kp", k=>{ cmpKey = k; renderCmp(); window.scrollTo(0,0); }, cmpMode==="set");
  }

/* クイズ */
let quizPool = [], quizMixed = false, quizCur = null, quizScore = {ok:0,n:0}, quizListen = false;
const hasBlank = e => e.ex.some(x=>/\[[^\]]+\]/.test(x[0]));
function pickOpts(ans){
  const labels = new Set([label(ans)]), out = [ans];
  const add = list => { for(const e of shuffle(list)){ if(out.length>=4) break; const l = label(e); if(!labels.has(l)){ labels.add(l); out.push(e); } } };
  if(quizMixed){ add(ALL.filter(e=>e.v===ans.v && e.p!==ans.p).slice(0,40)); add(ALL.filter(e=>e.p===ans.p && e.v!==ans.v)); }
  else { add(quizPool); add(ALL.filter(e=>e.v===ans.v)); add(ALL.filter(e=>e.p===ans.p)); }
  add(ALL);
  return shuffle(out);
}
const scoreText = () => quizScore.n ? `${quizScore.n}問中 ${quizScore.ok}問正解` : "";
function askQuiz(fromTap){
  const box = document.getElementById("quiz"); if(!box) return;
  const cands = quizPool.filter(hasBlank);
  if(!cands.length){ box.innerHTML = `<div class="qh"><h3>どれを使う？</h3></div><p class="qj">例文がまだないので、クイズは出せない。</p>`; return; }
  const ans = cands[Math.floor(Math.random()*cands.length)];
  const ex = shuffle(ans.ex.filter(x=>/\[[^\]]+\]/.test(x[0])))[0];
  const vv = ans.mine ? "" : ans.v;
  quizCur = {ans, ex, opts:pickOpts(ans), done:false};
  box.innerHTML = `<div class="qh"><h3>${quizListen?"聞いて選ぶ":"どれを使う？"}</h3>
      <div class="seg2" role="group" aria-label="出題のしかた"><button data-qmode="read" aria-pressed="${!quizListen}">読む</button><button data-qmode="listen" aria-pressed="${quizListen}">聞く</button></div></div>
    ${quizListen
      ? `<button class="playbig" data-say="${esc(ex[0])}" data-v="${esc(vv)}">${SPK}英文を聞く</button><p class="qs" id="qreveal" hidden>${markEx(ex[0])}</p><p class="qj" id="qrevealj" hidden>${esc(ex[1])}</p>`
      : `<p class="qs">${esc(ex[0]).replace(/\[[^\]]+\]/,`<span class="blank"></span>`)}</p><p class="qj">${esc(ex[1])}</p>`}
    <div class="opts">${quizCur.opts.map(o=>`<button class="opt" data-o="${esc(o.id)}">${esc(label(o))}</button>`).join("")}</div>
    <div class="fbk" hidden></div>
    <div class="qf"><span id="qscore">${scoreText()}</span><button class="btn primary" id="qnext">次の問題</button></div>`;
  if(!ans.mine) prefetch([ans.v]);
  if(quizListen && fromTap) say(ex[0], vv);
}
document.getElementById("cbody").addEventListener("click", e=>{
  if(e.target.closest("#qnext")) return askQuiz(true);

function exportBackup(){
  const data = {app:"kudoushi", v:1, at:new Date().toISOString(), notes:store.notes, learned:[...store.learned], mine:store.mine, lines:store.lines};
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], {type:"application/json"}));
  a.download = `kudoushi-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
async function importBackup(file){
  const o = JSON.parse(await file.text());
  if(!o || o.app!=="kudoushi") throw new Error("not a backup");
  const sig = m => [m.createdAt, m.v, m.p, m.x||""].join("|");
  const have = new Set(store.mine.map(sig));
  const newMine = (o.mine||[]).filter(m=>m && m.v && !have.has(sig(m)));
  const notes = {};
  for(const [k,v] of Object.entries(o.notes||{})){
    if(!v) continue; const cur = store.notes[k];
    if(!cur) notes[k] = v; else if(!cur.includes(v)) notes[k] = cur + "\n\n" + v;
  }
  const learned = [...new Set([...store.learned, ...(o.learned||[])])];
  const lsig = l => [l.createdAt, l.pv, l.text].join("|");
  const haveL = new Set(store.lines.map(lsig));
  const newLines = (o.lines||[]).filter(l=>l && l.text && !haveL.has(lsig(l)));
  if(store.mode==="db"){
    for(const [k,v] of Object.entries(notes)) await db.collection("notes").doc(k).set({text:v, updatedAt:Date.now()});
    await db.doc("state/learned").set({ids:learned});
    for(const m of newMine){ const {_id, ...rest} = m; await db.collection("mine").add(rest); }
    for(const l of newLines){ const {_id, ...rest} = l; await db.collection("lines").add(rest); }
  }else{
    Object.assign(store.notes, notes); store.learned = new Set(learned);
    newMine.forEach((m,i)=>store.mine.unshift({...m, _id:"l"+Date.now()+"_"+i}));
    newLines.forEach((l,i)=>store.lines.unshift({...l, _id:"s"+Date.now()+"_"+i}));
    store.lines.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    saveLocal(); rebuild(); onStoreChange(true);
  }
  return {notes:Object.keys(notes).length, mine:newMine.length, lines:newLines.length};
}

function onSwipe(el, fn){
  let x0 = null, y0 = 0;
  el.addEventListener("touchstart", e=>{
    const t = e.touches[0];
    x0 = (t.clientX < 32 || t.clientX > window.innerWidth - 32) ? null : t.clientX; y0 = t.clientY;
  }, {passive:true});
  el.addEventListener("touchend", e=>{
    if(x0 === null) return;
    const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if(Math.abs(dx) > 70 && Math.abs(dy) < Math.abs(dx) * 0.6) fn(dx < 0 ? 1 : -1);
  }, {passive:true});
}

let io = null;
function observeLazy(root){
  const els = root.querySelectorAll(".lazy:not(.obs)");
  if(!("IntersectionObserver" in window)){ els.forEach(el=>el.classList.add("vis")); return; }
  if(!io) io = new IntersectionObserver(ents=>ents.forEach(en=>en.target.classList.toggle("vis", en.isIntersecting)), {rootMargin:"80px"});
  els.forEach(el=>{ el.classList.add("obs"); io.observe(el); });
}

function setStill(on){
  document.body.classList.toggle("still", on);
  mbtn.setAttribute("aria-pressed", on);
  mbtn.setAttribute("aria-label", on ? "絵を動かす" : "絵の動きを止める");
  mbtn.innerHTML = (on ? ICON.play : ICON.pause) + `<span>${on ? "動かす" : "止める"}</span>`;
}
mbtn.addEventListener("click", ()=>setStill(!document.body.classList.contains("still")));
setStill(!!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches));

loadLocal(); rebuild();
renderFeature(); renderFilters(); renderList(); renderParts();
if(location.hash.length > 1){ applyHash(); detailDepth = 0; }  /* 開いた直後の詳細から「戻る」でアプリを抜けないように */
initStore();
</script>

<script>
/* オフラインで使えるようにする */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      const ask = () => { try{ if(!localStorage.getItem("pv-audio-1fa577ed") && navigator.serviceWorker.controller){ navigator.serviceWorker.controller.postMessage("precache-audio"); localStorage.setItem("pv-audio-1fa577ed", "1"); } }catch(e){} };
      if(navigator.serviceWorker.controller) ask(); else navigator.serviceWorker.addEventListener("controllerchange", ask);
    }).catch(() => {});
  });
}
</script>
